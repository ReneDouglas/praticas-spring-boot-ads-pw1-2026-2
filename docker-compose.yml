name: workspace-pwi-dockerizado

services:
  api-demo:
    build:
      context: ./demo
      dockerfile: Dockerfile
    ports:
      - "8080:8080"

  api-notificacao-sinan:
    build:
      context: ./notificacao-sinan
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
  
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sinandb
      MYSQL_USER: sinan
      MYSQL_PASSWORD: sinan123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: