name: workspace-pwi-dockerizado

services:
  api-demo:
    build:
      context: ./demo
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sinandb
    depends_on:
      postgres:
        condition: service_healthy

  api-notificacao-sinan:
    build:
      context: ./notificacao-sinan
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
  
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: sinandb
      POSTGRES_USER: sinan
      POSTGRES_PASSWORD: sinan123
      TZ: America/Fortaleza
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sinan -d sinandb"]
      interval: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: