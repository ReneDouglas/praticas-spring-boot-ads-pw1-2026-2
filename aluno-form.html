<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Cadastro de Aluno</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        form {
            width: 400px;
            margin: 50px auto;
            padding: 25px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        h2 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 12px;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 10px;
            border: none;
            border-radius: 4px;
            background-color: #007bff;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>

    <form action="http://localhost:8080/alunos/form" method="post">

        <h2>Cadastro de Aluno</h2>

        <label for="matricula">Matrícula</label>
        <input type="text" id="matricula" name="matricula">

        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome">

        <label for="curso">Curso</label>
        <input type="text" id="curso" name="curso">

        <label for="logradouro">Logradouro</label>
        <input type="text" id="logradouro" name="endereco.logradouro">

        <label for="numero">Número</label>
        <input type="text" id="numero" name="endereco.numero">

        <label for="bairro">Bairro</label>
        <input type="text" id="bairro" name="endereco.bairro">

        <label for="cidade">Cidade</label>
        <input type="text" id="cidade" name="endereco.cidade">

        <button type="submit">Cadastrar</button>

    </form>

</body>

</html>
